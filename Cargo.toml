[package]
name = "bewitched"
version = "0.2.3"
edition = "2021"
description = "A fast, cross-platform, hacker-esque hex editor for files, disks and RAM"
authors = ["realytcracker"]
license = "GPL-3.0-or-later"

[[bin]]
name = "bewitched"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
egui_extras = "0.29"
# PNG decode for the embedded donation-chip logos (already in the build graph
# via eframe, so this adds no new compilation).
image = { version = "0.25", default-features = false, features = ["png"] }
memmap2 = "0.9"
rfd = "0.15"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1.4"
crc = "3.2"
adler = "1.0"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "nasm"] }
yaxpeax-arch = "0.3"
yaxpeax-arm = "0.3"
yaxpeax-mips = "0.1"
# yaxpeax-mips targets the older arch trait crate; bring it in under a rename.
yaxpeax-arch-02 = { package = "yaxpeax-arch", version = "0.2" }
raki = "1.3"
ppc750cl = "0.3"
serde_json = "1"
yaxpeax-msp430 = "0.2"
yaxpeax-6502 = "0.0.2"
yaxpeax-sm83 = "0.2"
rhai = "1.19"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"
# Redirect the Apple-menu "About" item to our in-app about window. Versions are
# pinned to match winit's (it owns the NSApplication menu) so they unify.
objc2 = "0.5"
objc2-app-kit = "0.2"
objc2-foundation = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

# Portable edition: the release binary at target/release/bewitched is fully
# self-contained — copy it anywhere and run, no installation required.
#
# Installable edition: `cargo install cargo-bundle` then `cargo bundle --release`
# produces a native installer/app bundle (.app/.dmg on macOS, .deb on Linux,
# .msi on Windows) from the metadata below.
[package.metadata.bundle]
name = "bewitched"
identifier = "net.realytcracker.bewitched"
short_description = "A fast, cross-platform, hacker-esque hex editor."
long_description = """
bewitched is a fast hex editor for files, raw disks and RAM. It opens inputs of
any size instantly via memory mapping and a piece-table edit model with
unlimited undo, and offers search/replace, checksums, statistics, export,
byte patterns, data-folds and file tools.
"""
category = "DeveloperTool"
copyright = "Copyright (c) Digital Gangster Enterprises, LLC"
icon = ["assets/icon.png"]

# Debian package metadata for `cargo install cargo-deb` + `cargo deb`.
[package.metadata.deb]
maintainer = "Digital Gangster Enterprises, LLC <support@digitalgangster.com>"
section = "utils"
priority = "optional"
extended-description = "A fast, cross-platform, hacker-esque hex editor for files, disks and RAM."
