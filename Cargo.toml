[package]
name = "ganghex"
version = "0.1.0"
edition = "2021"
description = "A fast, cross-platform, hacker-esque hex editor for files, disks and RAM"
authors = ["realytcracker"]
license = "MIT"

[[bin]]
name = "ganghex"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
egui_extras = "0.29"
memmap2 = "0.9"
rfd = "0.15"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1.4"
crc = "3.2"
adler = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
